_schema-version: '3.3'
ID: enterprise-control-tower
version: 1.0.0
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands: [npm ci, npm run build]
modules:
  - name: enterprise-srv
    type: nodejs
    path: dist/srv
    parameters: {memory: 512M, instances: 2}
    provides:
      - name: srv-api
        properties: {srv-url: '${default-url}'}
    requires: [{name: enterprise-db}, {name: enterprise-auth}]
  - name: enterprise-db-deployer
    type: hdb
    path: dist/db
    requires: [{name: enterprise-db}]
  - name: enterprise-analytics-deployer
    type: hdb
    path: hana
    requires: [{name: enterprise-analytics}]
  - name: enterprise-router
    type: approuter.nodejs
    path: approuter
    requires:
      - name: enterprise-auth
      - name: srv-api
        group: destinations
        properties: {name: srv-api, url: '~{srv-url}', forwardAuthToken: true}
resources:
  - name: enterprise-db
    type: com.sap.xs.hdi-container
    parameters: {service: hana, service-plan: hdi-shared}
  - name: enterprise-analytics
    type: com.sap.xs.hdi-container
    parameters: {service: hana, service-plan: hdi-shared}
  - name: enterprise-auth
    type: org.cloudfoundry.managed-service
    parameters: {service: xsuaa, service-plan: application, path: xs-security.json}
